version: 0.2

phases:
  build:
    commands:
      - echo "Build block"
      - ls
      - echo 'Running tests to check if "Congratulations" present in index.html file'
      - grep "Congratulations" index.html

  post_build:
    commands:
      - echo "Post build phase"

artifacts:
  files:
    - appspec.yml
    - index.html
    - scripts/install_dependencies.sh
    - scripts/start_server
    - scripts/stop_server
  discard-paths: no
            
